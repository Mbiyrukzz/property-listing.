<!-- Office notification: a new enquiry, viewing request or application. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f2f6;padding:32px 16px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #dedbe6;border-radius:14px;">
        <tr>
          <td style="padding:28px 32px 0;">
            <span style="font-size:16px;font-weight:700;letter-spacing:-0.02em;color:#17151c;">BBHomes</span>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 28px;">
            <h1 style="margin:0 0 12px;font-size:20px;line-height:26px;font-weight:650;color:#17151c;">{{ heading }}</h1>
            <p style="margin:0 0 24px;font-size:14px;line-height:22px;color:#3d3a47;white-space:pre-line;">{{ body }}</p>
            <a href="{{ url }}" style="display:inline-block;padding:11px 20px;background:#0034ca;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:9px;">Open in admin</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
